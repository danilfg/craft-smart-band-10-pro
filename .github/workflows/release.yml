name: Build PocketCraft RPK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocketcraft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original pixel art
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_assets.py
      - name: Install Xiaomi Vela toolkit
        run: npm install --no-audit --no-fund
      - name: Validate project and test engine
        run: |
          npm run check
          npm test
      - name: Build real Vela quick app
        run: npm run build
      - name: Verify and prepare installable RPK
        shell: bash
        run: |
          set -euo pipefail
          find dist -name '*.rpk' -print
          RPK="$(find dist -type f -name '*.rpk' -print -quit)"
          test -n "$RPK"
          test -s "$RPK"
          mkdir -p out
          cp "$RPK" out/PocketCraft-Band10Pro.rpk
          test -s out/PocketCraft-Band10Pro.rpk
          file out/PocketCraft-Band10Pro.rpk
      - name: Upload built RPK
        uses: actions/upload-artifact@v4
        with:
          name: PocketCraft-Band10Pro-RPK
          path: out/PocketCraft-Band10Pro.rpk
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" out/PocketCraft-Band10Pro.rpk \
            --title "Pocket Craft $TAG" \
            --notes "Original offline voxel-survival sandbox RPK for Xiaomi Smart Band 10 Pro Ceramic (CN). This is a 2.5D isometric vertical slice with procedurally generated terrain, mine/build, Survival/Creative, crafting and local saves. Experimental: real-device compatibility is unverified." \
            --latest
